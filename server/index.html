<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
<title>tinclib chat</title>
<style>
  :root { color-scheme: light dark; --bg: #fff; --fg: #111; --muted: #888; --line: #ddd; --accent: #1565c0; }
  @media (prefers-color-scheme: dark) { :root { --bg: #111; --fg: #eee; --line: #333; --accent: #64b5f6; } }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { display: flex; flex-direction: column; height: 100dvh; background: var(--bg); color: var(--fg);
         font: 16px/1.4 system-ui, sans-serif; }
  header { padding: 12px 16px; border-bottom: 1px solid var(--line); font-weight: 600; }
  #log { flex: 1; overflow-y: auto; padding: 12px 16px; margin: 0; list-style: none; }
  #log li { margin: 0 0 8px; overflow-wrap: anywhere; }
  #log b { color: var(--accent); }
  form { display: flex; gap: 8px; padding: 8px 16px calc(8px + env(safe-area-inset-bottom));
         border-top: 1px solid var(--line); }
  input { font: inherit; padding: 10px; border: 1px solid var(--line); border-radius: 8px;
          background: var(--bg); color: var(--fg); min-width: 0; }
  #name { width: 6.5em; }
  #text { flex: 1; }
  button { font: inherit; padding: 10px 16px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; }
</style>
</head>
<body>
<header>tinclib chat</header>
<ul id="log"></ul>
<form id="form" autocomplete="off">
  <input id="name" placeholder="Name" maxlength="16" required aria-label="Name">
  <input id="text" placeholder="Message" maxlength="200" required aria-label="Message">
  <button>Send</button>
</form>
<script>
  const log = document.getElementById("log");
  const name = document.getElementById("name");
  const text = document.getElementById("text");
  let after = 0;

  try { name.value = localStorage.getItem("name") || ""; } catch {}

  async function poll() {
    try {
      const body = await (await fetch("messages?after=" + after)).text();
      const atBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 40;
      for (const line of body.split("\n")) {
        const [id, who, msg] = line.split("\t");
        if (!msg) continue;
        after = Number(id);
        const li = document.createElement("li");
        const b = document.createElement("b");
        b.textContent = who + ": ";
        li.append(b, msg);
        log.append(li);
      }
      if (atBottom) log.scrollTop = log.scrollHeight;
    } catch {}
  }

  document.getElementById("form").onsubmit = async (e) => {
    e.preventDefault();
    try { localStorage.setItem("name", name.value); } catch {}
    await fetch("messages", { method: "POST", body: name.value + "\n" + text.value });
    text.value = "";
    poll();
  };

  poll();
  setInterval(poll, 2000);
</script>
</body>
</html>

name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: gavinhsmith/setup-ti84-ce-toolchain@v1.0.0
        with:
          version: v15.0

      - name: Build
        run: make

      - uses: actions/upload-artifact@v4
        with:
          name: program
          path: bin/*.8xp

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" bin/TINCCHAT.8xp --generate-notes
